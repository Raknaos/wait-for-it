name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Auto-detect and run checks
        run: |
          set -e
          rc=0
          if ls test_*.py *_test.py >/dev/null 2>&1 || [ -d tests ]; then
            python3 -m unittest discover -v || rc=1
          fi
          for f in test/container-runners.py
test/wait-for-it.py
test_wait_for_it.py; do python3 -m py_compile "" || rc=1; done
          for f in wait-for-it.sh; do bash -n "" || rc=1; done
          if [ "" -ne 0 ]; then echo "checks failed"; exit 1; fi
          echo "all auto-detected checks green"
