name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Auto-detect and run checks
        run: |
          rc=0
          # run every test file in the shape it was written: standalone script
          # (has __main__ guard) else unittest module (exit 5 NO TESTS RAN is ok)
          for f in $(git ls-files 'test_*.py' '*_test.py'); do
            if grep -q '__main__' "$f"; then
              python3 "$f" || rc=1
            else
              out=$(python3 -m unittest "${f%.py}" 2>&1) || { echo "$out"; rc=1; }
            fi
          done
          for f in $(git ls-files '*.py'); do python3 -m py_compile "$f" || rc=1; done
          for f in $(git ls-files '*.sh'); do bash -n "$f" || rc=1; done
          if [ "$rc" -ne 0 ]; then echo "checks failed"; exit 1; fi
          echo "all auto-detected checks green"
